# detekt-конфигурация для STANKIN Schedule app.
# Применяется поверх дефолтных правил (buildUponDefaultConfig = true),
# поэтому здесь только переопределённые пороги.
# Имена свойств — для detekt 2.x (dev.detekt).

complexity:
  LongMethod:
    allowedLines: 60
    # Composable-функции по конвенции собирают UI-дерево декларативно и
    # законно длиннее 60 строк — не считаем это дефектом.
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    # У Composable-функций ветвления — это отображение состояний UI.
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    allowedDepth: 5
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    ignorePrivate: true
    # ApplicationPreference — фасад доступа к DataStore-настройкам, множество
    # мелких getter/setter-функций неизбежно; DateModel — доменная модель дат
    # с набором мелких операций. Искусственное разбиение не требуем.
    excludes:
      - '**/ApplicationPreference.kt'
      - '**/DateModel.kt'

style:
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  ReturnCount:
    # Несколько ранних return в начале функции (guard clauses) — нормальный
    # паттерн проекта, не считаем их нарушением.
    excludeGuardClauses: true
  ThrowsCount:
    excludeGuardClauses: true
  MagicNumber:
    # Числовые литералы в UI-модулях — размеры и отступы Compose/Glance
    # (16.dp, 8.dp и т.п.); выносить их в именованные константы не требуем.
    # В data/domain-слоях правило остаётся активным.
    excludes: ['**/ui/**/*.kt']
    # Литералы в объявлениях свойств уже имеют имя самого свойства
    # (цвета ThemeColors, ключи, пороги) — дополнительная константа избыточна.
    ignorePropertyDeclaration: true
    ignoreNamedArgument: true
    # Числа в объявлениях enum-элементов семантически привязаны к имени
    # элемента (Frequency.EVERY=7, курсы, типы оценок) — отдельные константы
    # не требуются.
    ignoreEnums: true

naming:
  FunctionNaming:
    # Composable-функции именуются в PascalCase по конвенции Compose.
    ignoreAnnotated: ['Composable']

empty-blocks:
  EmptyFunctionBlock:
    # Переопределённые колбэки Android-жизненного цикла, которые не нужны
    # (onLowMemory, onTrimMemory и т.п.), законно остаются пустыми.
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: false
