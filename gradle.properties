android.disallowKotlinSourceSets=false
android.enableJetifier=false
android.nonTransitiveRClass=true
android.useAndroidX=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEBUGGABLE_AND_MINIFIED_ENABLED
kapt.incremental.apt=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx8192M -Dkotlin.daemon.jvm.options\="-Xmx8192M" -XX\:+UseParallelGC -XX\:+HeapDumpOnOutOfMemoryError -Dhttps.protocols\=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols\=TLSv1.2,TLSv1.3
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.warning.mode=all
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-temurin,/usr/lib/jvm/java-21-openjdk-amd64
